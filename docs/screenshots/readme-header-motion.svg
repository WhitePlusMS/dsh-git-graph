<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">dsh-git-graph</title>
  <desc id="desc">Animated title source for the read-only Git Graph sidebar in DeepSeek Harness Web. The branch icon is reused from this project.</desc>

  <rect width="1200" height="280" rx="20" fill="#15171c"/>

  <!-- 低对比度底层保证首帧可读；分支形状沿用 icon.svg，不模拟真实仓库活动。 -->
  <g id="icon-base" transform="translate(48 52) scale(5.5)" fill="none">
    <path d="M9 6v20M9 17c0-7 14-1 14-9v-2" stroke="#30384a" stroke-width="3" stroke-linecap="round"/>
    <g fill="#8792a2" stroke="#30384a" stroke-width="3">
      <circle cx="9" cy="6" r="3"/>
      <circle cx="9" cy="26" r="3"/>
      <circle cx="23" cy="6" r="3"/>
    </g>
  </g>
  <g id="project-icon" transform="translate(48 52) scale(5.5)" fill="none">
    <path d="M9 6v20M9 17c0-7 14-1 14-9v-2" stroke="#4d6bfe" stroke-width="3" stroke-linecap="round"/>
    <g fill="#fff" stroke="#4d6bfe" stroke-width="3">
      <circle cx="9" cy="6" r="3"/>
      <circle cx="9" cy="26" r="3"/>
      <circle cx="23" cy="6" r="3"/>
    </g>
  </g>

  <!-- 名称一直存在；动效只改变强调层，停留阶段没有漂浮、闪烁或抖动。 -->
  <g id="title-base" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="266" y="132" fill="#8792a2" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="80" font-weight="700" letter-spacing="-2">dsh-git-graph</text>
    <text x="270" y="190" fill="#a7b0c0" font-size="32">DeepSeek Harness Web · read-only Git Graph</text>
  </g>
  <g id="project-title" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">
    <text x="266" y="132" fill="#f5f7fa" font-size="80" font-weight="700" letter-spacing="-2">dsh-git-graph</text>
  </g>
</svg>
