<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">dsh-git-graph</title>
  <desc id="desc">Read-only Git Graph for the native right sidebar of DeepSeek Harness Web, using the project's existing branch icon.</desc>

  <rect width="1200" height="280" rx="20" fill="#15171c"/>

  <!-- 复用 icon.svg 的分支路径、节点和主色；这里只放大，不绘制虚构的提交记录。 -->
  <g id="project-icon" transform="translate(48 52) scale(5.5)" fill="none">
    <path d="M9 6v20M9 17c0-7 14-1 14-9v-2" stroke="#4d6bfe" stroke-width="3" stroke-linecap="round"/>
    <g fill="#fff" stroke="#4d6bfe" stroke-width="3">
      <circle cx="9" cy="6" r="3"/>
      <circle cx="9" cy="26" r="3"/>
      <circle cx="23" cy="6" r="3"/>
    </g>
  </g>

  <!-- 版本与安装命令留在 Markdown，避免图片与可复制说明各自维护。 -->
  <g id="project-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="266" y="132" fill="#f5f7fa" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="80" font-weight="700" letter-spacing="-2">dsh-git-graph</text>
    <text x="270" y="190" fill="#a7b0c0" font-size="32">DeepSeek Harness Web · read-only Git Graph</text>
  </g>
</svg>
